server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: crediflow-api
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USER:crediflow}
    password: ${DB_PASSWORD:crediflow}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

crediflow:
  aws:
    region: ${AWS_REGION:us-east-1}
    endpoint: ${AWS_ENDPOINT:}
  s3:
    bucket: ${S3_BUCKET:crediflow-documentos}
  secrets:
    db-secret-id: ${DB_SECRET_ID:}
  cors:
    origenes: ${CORS_ORIGENES:http://localhost:4200,http://localhost:3100}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
