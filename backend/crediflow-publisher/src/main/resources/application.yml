server:
  port: ${PORT:8081}
  shutdown: graceful

spring:
  application:
    name: crediflow-publisher
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USER:crediflow}
    password: ${DB_PASSWORD:crediflow}
    hikari:
      maximum-pool-size: 3
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: UTC
  # Las migraciones las aplica la API; este servicio solo lee el outbox.
  flyway:
    enabled: false

crediflow:
  aws:
    region: ${AWS_REGION:us-east-1}
    endpoint: ${AWS_ENDPOINT:}
  secrets:
    db-secret-id: ${DB_SECRET_ID:}
  publisher:
    topic-arn: ${SNS_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:crediflow-solicitudes-recibidas}
    lote: 20
    max-intentos: 5
    intervalo-ms: ${PUBLISHER_INTERVALO_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include: health
