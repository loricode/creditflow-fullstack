name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unitarias + integración con Oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # verify = unitarias (surefire) + *IT con Testcontainers contra Oracle Free real
      - name: Compilar y probar
        working-directory: backend
        run: chmod +x mvnw && ./mvnw -B verify
      - name: Reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-backend
          path: |
            backend/**/target/surefire-reports
            crediflow-database/target/failsafe-reports

  frontend:
    name: Frontend (build + pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production
      - run: npm run test:ci

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive infrastructure/terraform
      - name: Validar entornos
        run: |
          for env in local produccion; do
            terraform -chdir=infrastructure/terraform/envs/$env init -backend=false -input=false
            terraform -chdir=infrastructure/terraform/envs/$env validate
          done

  imagenes:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
